<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<body>
  <div id="menu" class="screen">
    <h1>Escolha o Nível</h1>
    <button onclick="startGame(0)">Muito Fácil</button>
    <button onclick="startGame(1)">Fácil</button>
    <button onclick="startGame(2)">Médio</button>
    <button onclick="startGame(3)">Difícil</button>
    <button onclick="startGame(4)">Muito Difícil</button>
  </div>

  <div id="gameover" class="screen hidden">
    <h1>Game Over</h1>
    <button onclick="restart()">Reiniciar</button>
    <button onclick="goToMenu()">Cancelar</button>
  </div>

  <div id="victory" class="screen hidden">
    <h1>🎉 Você concluiu todas as fases!</h1>
    <button onclick="goToMenu()">Voltar ao Menu</button>
  </div>

  <div id="canvas-container" class="screen hidden">
    <script src="sketch.js"></script>
  </div>
</body>

<style>
  body {
    background: #000;
    color: white;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
    gap: 1rem;
  }
  .screen {
    text-align: center;
  }
  .hidden {
    display: none;
  }
  canvas {
    border: 2px solid #ffa32b;
  }
</style>
